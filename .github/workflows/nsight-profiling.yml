name: Build, Profile & Publish Nsight Systems Container

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: azdevops143/nsightprofiling-gpu

jobs:
  build-and-profile:
    name: Build & Package Nsight Systems Profiler
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to NVIDIA NGC
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        run: |
          if [[ -n "$NGC_API_KEY" ]]; then
            printf '%s' "$NGC_API_KEY" | docker login nvcr.io \
              --username '$oauthtoken' --password-stdin
          else
            echo "NGC_API_KEY is not configured; trying anonymous access to public NGC images."
          fi

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Nsight Profiling Container
        run: |
          echo "Building container from official NVIDIA NGC Nsight Systems CLI base..."
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .

      - name: Verify Container & Nsight Systems CLI
        run: |
          echo "Verifying Nsight Systems CLI inside container..."
          docker run --rm --entrypoint nsys \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest --version

      - name: Run Profiling (or verify runner capability)
        run: |
          mkdir -p reports
          if command -v nvidia-smi &> /dev/null && nvidia-smi &> /dev/null; then
            echo "NVIDIA GPU detected. Executing live Nsight Systems profiling..."
            docker run --gpus all --privileged --ipc=host --rm \
              -v $(pwd)/reports:/reports \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest 256 1e-4 1000

          else
            echo "Standard runner without physical GPU detected."
            echo "Only committed profiler reports can be uploaded without a GPU runner."
          fi

          echo "Listing reports directory:"
          ls -la reports/

      - name: Upload Nsight Profiling Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nsight-systems-and-compute-reports
          path: |
            reports/*.nsys-rep
            reports/*.ncu-rep
          if-no-files-found: error
          retention-days: 30

      - name: Push Container to GHCR
        if: github.event_name != 'pull_request'
        run: |
          echo "Pushing image to ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest..."
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
